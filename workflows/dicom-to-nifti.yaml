apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pipeline-dicom-to-nifti
spec:
  templates:
    - name: dicom-to-nifti
      inputs:
        parameters:
          - name: dicom-dir
          - name: nifti-file
          - name: pet-values
            value: suv
            enum:
              - suv
              - raw
      container:
        image: negarshahamiri/dicom-to-nifti:1.0
        command:
          - python
          - /app/dicom_to_nifti.py
        args:
          - "-i"
          - "{{inputs.parameters.dicom-dir}}"
          - "-o"
          - "{{inputs.parameters.nifti-file}}"
          - "--pet"
          - "{{inputs.parameters.pet-values}}"
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            memory: 16Gi
