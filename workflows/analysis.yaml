apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pipeline-analysis
spec:
  templates:
    - name: analysis
      inputs:
        parameters:
          - name: dicom-pet-dir
          - name: image-dir
          - name: ct-segmentation-dir
          - name: accession-number
          - name: study-date
            value: ""
      container:
        image: &analysis negarshahamiri/petct-analysis:1.0
        command:
          - python
          - /app/main.py
        args:
          - --dicom_pet_path
          - "{{inputs.parameters.dicom-pet-dir}}"
          - --date
          - "{{inputs.parameters.study-date}}"
          - --output_path
          - "{{inputs.parameters.image-dir}}"
          - --ct_segmentation_dir
          - "{{inputs.parameters.ct-segmentation-dir}}"
          - --accession_number
          - "{{inputs.parameters.accession-number}}"
        workingDir: /app
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: "2"
            memory: 16Gi
          limits:
            memory: 32Gi
      outputs:
        parameters:
          - name: seg
            value: "{{inputs.parameters.image-dir}}/tumor_seg.dcm"
          - name: png
            value: "{{inputs.parameters.image-dir}}/result.png"
    - name: insightmip
      inputs:
        parameters:
          - name: prior-png
            value: ""
          - name: subsequent-png
          - name: output-png
      container:
        image: *analysis
        command:
          - python
          - /app/insightmip.py
        args:
          - --prior
          - "{{inputs.parameters.prior-png}}"
          - --subsequent
          - "{{inputs.parameters.subsequent-png}}"
          - --output
          - "{{inputs.parameters.output-png}}"
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
      outputs:
        parameters:
          - name: png
            value: "{{inputs.parameters.output-png}}"
    - name: save-results
      inputs:
        parameters:
          - name: image-dir
          - name: insightmip-png
          - name: results-dir
      container:
        image: negarshahamiri/petct-tools:1.1
        command:
          - save-results
        args:
          - "{{inputs.parameters.results-dir}}"
          - "{{inputs.parameters.image-dir}}/tumor_seg.dcm"
          - "{{inputs.parameters.image-dir}}/tumor_seg.nii.gz"
          - "{{inputs.parameters.insightmip-png}}"
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
