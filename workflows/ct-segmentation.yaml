apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pipeline-ct-segmentation
spec:
  templates:
    - name: ct-segmentation
      inputs:
        parameters:
          - name: ct
          - name: output-dir
      activeDeadlineSeconds: 7200
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
      container:
        image: wasserth/totalsegmentator:2.2.1
        command:
          - TotalSegmentator
        args:
          - "-i"
          - "{{inputs.parameters.ct}}"
          - "-o"
          - "{{inputs.parameters.output-dir}}"
        env:
          - name: TOTALSEG_HOME_DIR
            value: /data/.totalsegmentator
        volumeMounts:
          - name: data
            mountPath: /data
          - name: dshm
            mountPath: /dev/shm
        resources:
          requests:
            cpu: "4"
            memory: 50Gi
          limits:
            memory: 50Gi
            nvidia.com/gpu: 1
