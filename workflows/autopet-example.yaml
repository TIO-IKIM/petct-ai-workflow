apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pipeline-autopet-example
  annotations:
    workflows.argoproj.io/description: Loads an autoPET test patient into Orthanc.
spec:
  entrypoint: load
  arguments:
    parameters:
      - name: patient-id
        value: PETCT_15f4b7254f
      - name: accession-prefix
        value: AUTOPET-15F4
      - name: icd10
        value: C81.9
        description: Diagnosis for FHIR (empty = none)
      - name: fhir-url
        value: http://hapi-fhir:8080/fhir
      - name: orthanc-url
        value: http://orthanc:8042
  templates:
    - name: load
      container:
        image: negarshahamiri/autopet-loader:1.0
        env:
          - name: PATIENT_ID
            value: "{{workflow.parameters.patient-id}}"
          - name: PREFIX
            value: "{{workflow.parameters.accession-prefix}}"
          - name: ORTHANC_URL
            value: "{{workflow.parameters.orthanc-url}}"
          - name: ICD10
            value: "{{workflow.parameters.icd10}}"
          - name: FHIR_URL
            value: "{{workflow.parameters.fhir-url}}"
          - name: ORTHANC_USERNAME
            valueFrom:
              secretKeyRef:
                name: orthanc-login
                key: username
          - name: ORTHANC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: orthanc-login
                key: password
        resources:
          requests:
            memory: 1Gi
