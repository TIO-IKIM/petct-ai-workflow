apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pipeline
  annotations:
    workflows.argoproj.io/description: Segments a PET/CT study and sends the segmentation and InsightMIP back to the PACS.
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: accession-number
        value: ""
        description: Current scan
      - name: prior-accession-number
        value: ""
        description: Prior scan (optional)
      - name: pet-series
        value: auto
        description: "auto (picked from DICOM tags) or a SeriesDescription pattern, wildcards allowed"
      - name: ct-series
        value: auto
        description: "auto (picked from DICOM tags) or a SeriesDescription pattern, wildcards allowed"
      - name: retrieve-from-pacs
        value: "false"
        enum:
          - "true"
          - "false"
      - name: send-to-pacs
        value: "false"
        enum:
          - "true"
          - "false"
      - name: send-pet-ct
        value: "false"
        enum:
          - "true"
          - "false"
        description: Also send PET and CT (for a different PACS)
      - name: send-protocol
        value: dimse
        enum:
          - dimse
          - dicomweb
      - name: pacs
        value: pacs
        description: Retrieve from
      - name: send-target
        value: pacs
        description: Send to
      - name: orthanc-url
        value: http://orthanc:8042
      - name: fhir-url
        value: ""
        description: Optional, for the DiagnosticReport
      - name: pvc
        value: petct-data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: "{{workflow.parameters.pvc}}"
  templates:
    - name: main
      steps:
        -   - name: current
              template: timepoint
              arguments:
                parameters:
                  - name: accession-number
                    value: "{{workflow.parameters.accession-number}}"
                  - name: dir
                    value: "/data/runs/{{workflow.name}}/current"
            - name: prior
              template: timepoint
              when: "'{{workflow.parameters.prior-accession-number}}' != ''"
              arguments:
                parameters:
                  - name: accession-number
                    value: "{{workflow.parameters.prior-accession-number}}"
                  - name: dir
                    value: "/data/runs/{{workflow.name}}/prior"
        -   - name: insightmip
              templateRef:
                name: pipeline-analysis
                template: insightmip
              arguments:
                parameters:
                  - name: prior-png
                    value: "/data/runs/{{workflow.name}}/prior/nifti/result.png"
                  - name: subsequent-png
                    value: "{{steps.current.outputs.parameters.png}}"
                  - name: output-png
                    value: "/data/runs/{{workflow.name}}/insightmip.png"
        -   - name: uploadseg
              templateRef: &orthanc
                name: pipeline-orthanc
                template: request
              arguments:
                parameters:
                  - name: path
                    value: /instances
                  - name: file
                    value: "{{steps.current.outputs.parameters.seg}}"
            - name: createresult
              templateRef:
                name: pipeline-orthanc
                template: create-result-image
              arguments:
                parameters:
                  - name: study-id
                    value: "{{steps.current.outputs.parameters.study-id}}"
                  - name: png
                    value: "{{steps.insightmip.outputs.parameters.png}}"
        -   - name: send-results
              templateRef: &send
                name: pipeline-orthanc
                template: send
              when: "{{workflow.parameters.send-to-pacs}} == true"
              arguments:
                parameters:
                  - name: resources
                    value: '"{{steps.uploadseg.outputs.parameters.series}}", "{{steps.createresult.outputs.parameters.series}}"'
                  - name: target
                    value: "{{workflow.parameters.send-target}}"
                  - name: protocol
                    value: "{{workflow.parameters.send-protocol}}"
            - name: send-pet-ct
              templateRef: *send
              when: "{{workflow.parameters.send-to-pacs}} == true && {{workflow.parameters.send-pet-ct}} == true"
              arguments:
                parameters:
                  - name: resources
                    value: '"{{steps.current.outputs.parameters.pet-series-id}}", "{{steps.current.outputs.parameters.ct-series-id}}"'
                  - name: target
                    value: "{{workflow.parameters.send-target}}"
                  - name: protocol
                    value: "{{workflow.parameters.send-protocol}}"
            - name: fhir-report
              templateRef:
                name: pipeline-fhir
                template: diagnostic-report
              when: "'{{workflow.parameters.fhir-url}}' != ''"
              arguments:
                parameters:
                  - name: fhir-url
                    value: "{{workflow.parameters.fhir-url}}"
                  - name: accession-number
                    value: "{{workflow.parameters.accession-number}}"
                  - name: png
                    value: "{{steps.insightmip.outputs.parameters.png}}"
            - name: save-results
              templateRef:
                name: pipeline-analysis
                template: save-results
              arguments:
                parameters:
                  - name: image-dir
                    value: "/data/runs/{{workflow.name}}/current/nifti"
                  - name: insightmip-png
                    value: "{{steps.insightmip.outputs.parameters.png}}"
                  - name: results-dir
                    value: "/data/results/{{workflow.parameters.accession-number}}"
    - name: timepoint
      inputs:
        parameters:
          - name: accession-number
          - name: dir
      steps:
        -   - name: retrieve-from-pacs
              templateRef:
                name: pipeline-orthanc
                template: retrieve-from-pacs
              when: "{{workflow.parameters.retrieve-from-pacs}} == true"
              arguments:
                parameters:
                  - name: pacs
                    value: "{{workflow.parameters.pacs}}"
                  - name: accession-number
                    value: "{{inputs.parameters.accession-number}}"
        -   - name: findstudy
              templateRef: *orthanc
              arguments:
                parameters:
                  - name: path
                    value: /tools/find
                  - name: body
                    value: '{"Level": "Study", "Query": {"AccessionNumber": "{{inputs.parameters.accession-number}}"}}'
                  - name: require
                    value: >-
                      Study {{inputs.parameters.accession-number}} is not in Orthanc. Check the accession
                      number, or submit with retrieve-from-pacs=true.
        -   - name: selectseries
              templateRef:
                name: pipeline-orthanc
                template: select-series
              arguments:
                parameters:
                  - name: accession-number
                    value: "{{inputs.parameters.accession-number}}"
                  - name: pet-series
                    value: "{{workflow.parameters.pet-series}}"
                  - name: ct-series
                    value: "{{workflow.parameters.ct-series}}"
            - name: studyinfo
              templateRef: *orthanc
              arguments:
                parameters:
                  - name: path
                    value: "/studies/{{steps.findstudy.outputs.parameters.first}}"
                  - name: method
                    value: GET
        -   - name: download-pet
              templateRef: &download
                name: pipeline-orthanc
                template: download-series
              arguments:
                parameters:
                  - name: series-id
                    value: "{{steps.selectseries.outputs.parameters.pet}}"
                  - name: dir
                    value: "{{inputs.parameters.dir}}/dicom/pet"
            - name: download-ct
              templateRef: *download
              arguments:
                parameters:
                  - name: series-id
                    value: "{{steps.selectseries.outputs.parameters.ct}}"
                  - name: dir
                    value: "{{inputs.parameters.dir}}/dicom/ct"
        -   - name: convert-ct
              templateRef: &dicom-to-nifti
                name: pipeline-dicom-to-nifti
                template: dicom-to-nifti
              arguments:
                parameters:
                  - name: dicom-dir
                    value: "{{inputs.parameters.dir}}/dicom/ct"
                  - name: nifti-file
                    value: "{{inputs.parameters.dir}}/nifti/petct_0000.nii.gz"
            - name: convert-pet
              templateRef: *dicom-to-nifti
              arguments:
                parameters:
                  - name: dicom-dir
                    value: "{{inputs.parameters.dir}}/dicom/pet"
                  - name: nifti-file
                    value: "{{inputs.parameters.dir}}/nifti/petct_0001.nii.gz"
        -   - name: resample-ct
              templateRef:
                name: pipeline-resample-ct
                template: resample-ct
              arguments:
                parameters:
                  - name: ct
                    value: "{{inputs.parameters.dir}}/nifti/petct_0000.nii.gz"
                  - name: pet
                    value: "{{inputs.parameters.dir}}/nifti/petct_0001.nii.gz"
        -   - name: ct-segmentation
              templateRef:
                name: pipeline-ct-segmentation
                template: ct-segmentation
              arguments:
                parameters:
                  - name: ct
                    value: "{{inputs.parameters.dir}}/nifti/petct_0000.nii.gz"
                  - name: output-dir
                    value: "{{inputs.parameters.dir}}/ct-segmentation"
            - name: pet-segmentation
              templateRef:
                name: pipeline-pet-segmentation
                template: pet-segmentation
              arguments:
                parameters:
                  - name: image-dir
                    value: "{{inputs.parameters.dir}}/nifti"
                  - name: output-dir
                    value: "{{inputs.parameters.dir}}/nifti"
        -   - name: analysis
              templateRef:
                name: pipeline-analysis
                template: analysis
              arguments:
                parameters:
                  - name: dicom-pet-dir
                    value: "{{inputs.parameters.dir}}/dicom/pet"
                  - name: image-dir
                    value: "{{inputs.parameters.dir}}/nifti"
                  - name: ct-segmentation-dir
                    value: "{{inputs.parameters.dir}}/ct-segmentation"
                  - name: accession-number
                    value: "{{inputs.parameters.accession-number}}"
                  - name: study-date
                    value: "{{steps.studyinfo.outputs.parameters.date}}"
      outputs:
        parameters:
          - name: study-id
            valueFrom:
              parameter: "{{steps.findstudy.outputs.parameters.first}}"
          - name: pet-series-id
            valueFrom:
              parameter: "{{steps.selectseries.outputs.parameters.pet}}"
          - name: ct-series-id
            valueFrom:
              parameter: "{{steps.selectseries.outputs.parameters.ct}}"
          - name: seg
            valueFrom:
              parameter: "{{steps.analysis.outputs.parameters.seg}}"
          - name: png
            valueFrom:
              parameter: "{{steps.analysis.outputs.parameters.png}}"
