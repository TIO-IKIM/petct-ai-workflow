apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pipeline-orthanc
spec:
  arguments:
    parameters:
      - name: orthanc-url
        value: http://orthanc:8042
  templates:
    - name: request
      inputs:
        parameters:
          - name: path
          - name: method
            value: POST
          - name: body
            value: ""
          - name: file
            value: ""
          - name: require
            value: ""
            description: error if nothing found
      container:
        image: &tools negarshahamiri/petct-tools:1.1
        command:
          - orthanc-request
        args:
          - "{{inputs.parameters.path}}"
          - "{{inputs.parameters.method}}"
          - "{{inputs.parameters.body}}"
          - "{{inputs.parameters.file}}"
          - "{{inputs.parameters.require}}"
        env: &orthanc-env
          - name: ORTHANC_URL
            value: "{{workflow.parameters.orthanc-url}}"
          - name: ORTHANC_USERNAME
            valueFrom:
              secretKeyRef:
                name: orthanc-login
                key: username
          - name: ORTHANC_PASSWORD
            valueFrom:
              secretKeyRef:
                name: orthanc-login
                key: password
        volumeMounts: &data-mount
          - name: data
            mountPath: /data
        resources: &small
          requests:
            cpu: 100m
            memory: 128Mi
      outputs:
        parameters:
          - name: first
            valueFrom:
              path: /tmp/first
              default: ""
          - name: id
            valueFrom:
              path: /tmp/id
              default: ""
          - name: series
            valueFrom:
              path: /tmp/series
              default: ""
          - name: date
            valueFrom:
              path: /tmp/date
              default: ""
    - name: retrieve-from-pacs
      inputs:
        parameters:
          - name: pacs
          - name: accession-number
      steps:
        -   - name: query
              template: request
              arguments:
                parameters:
                  - name: path
                    value: "/modalities/{{inputs.parameters.pacs}}/query"
                  - name: body
                    value: '{"Level": "Study", "Query": {"AccessionNumber": "{{inputs.parameters.accession-number}}"}}'
        -   - name: answers
              template: request
              arguments:
                parameters:
                  - name: path
                    value: "/queries/{{steps.query.outputs.parameters.id}}/answers"
                  - name: method
                    value: GET
                  - name: require
                    value: "The PACS has no study with accession number {{inputs.parameters.accession-number}}."
        -   - name: retrieve
              template: request
              arguments:
                parameters:
                  - name: path
                    value: "/queries/{{steps.query.outputs.parameters.id}}/retrieve"
                  - name: body
                    value: '{"Synchronous": true}'
    - name: select-series
      inputs:
        parameters:
          - name: accession-number
          - name: pet-series
            value: auto
          - name: ct-series
            value: auto
      container:
        image: *tools
        command:
          - orthanc-select-series
        args:
          - "{{inputs.parameters.accession-number}}"
          - "{{inputs.parameters.pet-series}}"
          - "{{inputs.parameters.ct-series}}"
        env: *orthanc-env
        resources: *small
      outputs:
        parameters:
          - name: pet
            valueFrom:
              path: /tmp/pet
          - name: ct
            valueFrom:
              path: /tmp/ct
    - name: download-series
      inputs:
        parameters:
          - name: series-id
          - name: dir
      container:
        image: *tools
        command:
          - orthanc-download
        args:
          - "{{inputs.parameters.series-id}}"
          - "{{inputs.parameters.dir}}"
        env: *orthanc-env
        volumeMounts: *data-mount
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
    - name: create-result-image
      inputs:
        parameters:
          - name: study-id
          - name: png
      container:
        image: *tools
        command:
          - orthanc-create-image
        args:
          - "{{inputs.parameters.study-id}}"
          - "{{inputs.parameters.png}}"
        env: *orthanc-env
        volumeMounts: *data-mount
        resources: *small
      outputs:
        parameters:
          - name: series
            valueFrom:
              path: /tmp/series
    - name: send
      inputs:
        parameters:
          - name: resources
            description: '"id1", "id2"'
          - name: target
          - name: protocol
            value: dimse
            enum:
              - dimse
              - dicomweb
      container:
        image: *tools
        command:
          - orthanc-send
        args:
          - "{{inputs.parameters.resources}}"
          - "{{inputs.parameters.target}}"
          - "{{inputs.parameters.protocol}}"
        env: *orthanc-env
        resources: *small
      retryStrategy:
        limit: "2"
        backoff:
          duration: "1m"
          factor: "2"
