apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: pipeline-fhir
spec:
  templates:
    - name: diagnostic-report
      inputs:
        parameters:
          - name: fhir-url
          - name: accession-number
          - name: png
      container:
        image: negarshahamiri/petct-tools:1.1
        command:
          - fhir-report
        args:
          - "{{inputs.parameters.fhir-url}}"
          - "{{inputs.parameters.accession-number}}"
          - "{{inputs.parameters.png}}"
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
