# Argo artifact repository for the pipeline (InsightMIP is stored here as an output artifact,
# downloadable in the Argo UI). Referenced by artifactRepositoryRef in pipeline.yaml and
# rerun-insightmip.yaml. Set bucket, endpoint and the credentials secret for your S3 storage.
# endpoint: host[:port] only, without https:// (Argo refuses a URL here; insecure: false = HTTPS).
apiVersion: v1
kind: ConfigMap
metadata:
  name: petct-artifacts
data:
  s3: |
    s3:
      bucket: my-bucket
      endpoint: s3.example.org
      insecure: false
      keyFormat: "petct-reading/{{workflow.name}}/{{pod.name}}"
      accessKeySecret: {name: s3-credentials, key: accesskey}
      secretKeySecret: {name: s3-credentials, key: secretkey}
